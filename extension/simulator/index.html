<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chess TV simulator</title>
    <style>
      body {
        font: 16px system-ui;
        background: #f5f5f4;
        color: #292524;
        margin: 32px;
        max-width: 850px;
      }
      h1 {
        margin-bottom: 4px;
      }
      p {
        color: #57534e;
      }
      main {
        display: flex;
        gap: 32px;
        align-items: start;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(8, 64px);
        border: 6px solid #44403c;
      }
      #board button {
        height: 64px;
        border: 0;
        font-size: 46px;
        line-height: 1;
        cursor: pointer;
      }
      .light {
        background: #eee4d1;
      }
      .dark {
        background: #809879;
      }
      .selected {
        box-shadow: inset 0 0 0 4px #e7aa2c;
      }
      aside {
        display: grid;
        gap: 14px;
        width: 230px;
      }
      button,
      select {
        font: inherit;
        padding: 8px;
      }
      #promotions {
        margin-top: 16px;
      }
      #promotions[hidden] {
        display: none;
      }
      label {
        display: block;
      }
      code {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Chess TV simulator</h1>
    <p>Fixture-backed page. Real Chess.com integration is not enabled.</p>
    <p id="description"></p>
    <main>
      <div>
        <div id="board"></div>
        <div
          id="promotions"
          hidden
        >
          <span>Promote to: </span><button data-promotion="q">Queen</button
          ><button data-promotion="r">Rook</button><button data-promotion="b">Bishop</button
          ><button data-promotion="n">Knight</button>
        </div>
      </div>
      <aside>
        <label
          >Scenario<select id="scenario">
            <option value="normal">White · e2 → e4</option>
            <option value="black">Black · e7 → e5</option>
            <option value="castling">Castling · e1 → g1</option>
            <option value="en-passant">En passant · e5 → d6</option>
            <option value="promotion">Promotion · a7 → a8</option>
          </select></label
        ><label
          >Page response<select id="delay">
            <option value="0">Immediate</option>
            <option value="6500">After 6.5 seconds</option>
            <option value="-1">Never respond</option>
          </select></label
        ><label
          ><input
            type="checkbox"
            id="reject"
          />
          Reject moves</label
        ><button id="new-game">New game</button><button id="result">End as draw</button
        ><button id="broken">Toggle broken observation</button
        ><button id="frozen">Toggle stale observation</button>
        <p>
          Changing scenario creates a new game. Attach it explicitly in the extension. Click squares
          here to simulate direct Chrome input.
        </p>
      </aside>
    </main>
    <script
      type="application/json"
      id="chess-tv-state"
    ></script>
    <script
      type="module"
      src="/main.js"
    ></script>
  </body>
</html>
